mutation CreateClubData @auth(level: USER) {
  club_insert(data: { name: "Chess Club", description: "Learn strategy", missionStatement: "Promote chess" })
}

mutation DeleteClub($id: UUID!) @auth(level: USER) {
  club_delete(key: {id: $id})
}

mutation UpdateClub($id: UUID!, $description: String!) @auth(level: USER) {
  club_update(key: {id: $id}, data: { description: $description })
}

query GetClub($id: UUID!) @auth(level: PUBLIC, insecureReason: "Clubs are public information") {
  club(id: $id) { name description }
}

query ListClubs @auth(level: PUBLIC, insecureReason: "Clubs are public information") {
  clubs { name }
}

mutation CreateEvent($data: Event_Data!) @auth(level: USER) {
  event_insert(data: $data)
}

mutation DeleteEvent($id: UUID!) @auth(level: USER) {
